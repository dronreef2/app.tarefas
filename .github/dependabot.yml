version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 10
    # Auto-merge patch updates (semver-patch) once CI is green.
    # (Requires branch protection + auto-merge to be enabled in repo settings.)
    groups:
      patch-and-minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'ci'
